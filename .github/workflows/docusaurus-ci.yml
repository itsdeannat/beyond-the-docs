name: Docusaurus CI

on:
    pull_request:
        branches:
            -main

permissions:
    contents: read

jobs:
    build:
        name: Build website
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 24
                package-manager-cache: false
            - name: Install dependencies
              run: npm ci
            - name: Build Docusaurus site
              run: npm run build

