name: Docusaurus CI

on:
    pull_request:
      branches:
        - main

permissions:
    contents: read

jobs:
    build:
        name: Build website
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
            - name: Build Docusaurus site with Docker
              run: docker build -t beyond-the-docs:ci .

