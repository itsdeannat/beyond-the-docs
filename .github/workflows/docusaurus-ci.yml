name: Docusaurus CI

on:
    pull_request:
      branches:
        - main

permissions:
    contents: read

jobs:
    build:
        name: Build website
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
            - name: Build Docusaurus site with Docker
              run: docker build -t beyond-the-docs:ci .
            - name: Start website container
              run: |
                docker run -d --rm \
                  --name beyond-the-docs-smoke \
                  -p 127.0.0.1:8080:8080 \
                  beyond-the-docs:ci \
                  npx --yes http-server /app/build -a 0.0.0.0 -p 8080

            - name: Check website response
              run: |
                for attempt in {1..10}; do
                  if curl --fs http://127.0.0.1:8080/ > /dev/null; then
                     echo "Website responded successfully."
                     exit 0
                  fi
                  sleep 2
                done

                echo "Website did not respond successfully."
                docker logs beyond-the-docs-smoke
                exit 1

            - name: Stop website container
              if: always()
              run: docker stop beyond-the-docs-smoke || true

